<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MailPulse</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img src="icons/icon32.png" alt="" width="20" height="20" />
        <span>MailPulse</span>
      </div>
      <div class="top-actions">
        <span id="syncState" class="muted small"></span>
        <button id="syncBtn" class="icon-btn" title="Sync now" aria-label="Sync now">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 4a8 8 0 0 1 7.4 5H17v2h6V5h-2v2.3A10 10 0 0 0 2 12h2a8 8 0 0 1 8-8Zm8 8a8 8 0 0 1-15.4 3H7v-2H1v6h2v-2.3A10 10 0 0 0 22 12h-2Z"/></svg>
        </button>
        <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.3 7.3 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.3 7.3 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5L19.4 13ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg>
        </button>
      </div>
    </header>

    <div id="setup" class="setup" hidden>
      <p><strong>Connect your tracking backend to start.</strong></p>
      <p class="muted">Add your backend URL and secret in Settings. The README explains how to deploy the backend.</p>
      <button id="setupBtn" class="primary">Open settings</button>
    </div>

    <section class="stats" id="stats"></section>

    <div class="controls">
      <input id="search" type="search" placeholder="Search recipient or subject" aria-label="Search" />
      <nav class="tabs" id="tabs" role="tablist"></nav>
    </div>

    <main id="list" class="list" aria-live="polite"></main>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
